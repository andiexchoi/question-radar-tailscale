name: Refresh question signals

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect public questions
        run: node scripts/collect.mjs
      - name: Commit a changed dataset
        run: |
          if git diff --quiet -- data/questions.json public/questions.json; then
            echo "No dataset changes"
            exit 0
          fi
          git config user.name "question-radar-bot"
          git config user.email "question-radar-bot@users.noreply.github.com"
          git add data/questions.json public/questions.json
          git commit -m "Refresh question signals"
          git push
